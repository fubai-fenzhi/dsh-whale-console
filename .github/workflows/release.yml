# Copy to .github/workflows/release.yml in the package repository.
#
# Trusted publishing (recommended): configure it once on npmjs.com
#   package page -> Settings -> Trusted publishing -> GitHub Actions
#   repository: <owner>/<repo>   workflow filename: release.yml
# Then a tag push (v1.2.3) publishes without any npm token or OTP.
#
# Without trusted publishing, replace the last step with the commented fallback
# and store a granular npm token (Read and write, Bypass 2FA) in the NPM_TOKEN
# repository secret. Never commit that token.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use the npm CLI that supports trusted publishing
        run: npm install -g npm@latest

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test
        run: |
          if [ -d test ]; then
            for file in test/*.test.mjs; do
              [ -e "$file" ] || continue
              node "$file"
            done
          fi

      - name: Publish with provenance
        run: npm publish --provenance --access public

      # Fallback when trusted publishing is not configured:
      # - name: Publish with a token
      #   run: npm publish --provenance --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
